<!DOCTYPE html>
<html lang="bg">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Контакти | СУ „Недялка Шилева“</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: "Inter", sans-serif;

            background: #faf7f1;

            color: #252525;
        }

        header {

            background: #fffdf8;

            border-bottom: 1px solid #e8dfd2;

            padding: 25px 6%;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        header h1 {

            font-family: "Cormorant Garamond", serif;

            font-size: 30px;

        }


        header a {

            text-decoration: none;

            color: #8e2928;

            font-size: 14px;

        }


        header a:hover {

            color: #28553d;

        }

        .contacts {

            max-width: 850px;

            margin: auto;

            padding: 65px 20px;

        }


        .contacts-title {

            text-align: center;

            margin-bottom: 40px;

        }


        .contacts-title h2 {

            font-family: "Cormorant Garamond", serif;

            font-size: 42px;

            margin-bottom: 8px;

        }


        .contacts-title p {

            font-size: 13px;

            color: #777;

        }

        .contact-box {

            background: #fffdf8;

            border: 1px solid #e4dacd;

            padding: 35px;

        }


        .contact-item {

            padding: 18px 0;

            border-bottom: 1px solid #e8dfd2;

        }


        .contact-item:last-child {

            border-bottom: none;

        }


        .contact-item h3 {

            font-family: "Cormorant Garamond", serif;

            font-size: 22px;

            color: #8e2928;

            margin-bottom: 6px;

        }


        .contact-item p {

            font-size: 14px;

            color: #555;

            line-height: 1.6;
            
        }

        a{
            text-decoration: none;
            color: inherit;
        }

        .back {

            text-align: center;

            margin-top: 35px;

        }


        .back a {

            display: inline-block;

            background: #8e2928;

            color: white;

            padding: 11px 22px;

            border-radius: 25px;

            text-decoration: none;

            font-size: 13px;

            transition: 0.3s;

        }


        .back a:hover {

            background: #6f2020;

        }

        @media (max-width: 700px) {

            header {

                padding: 20px;

            }


            header h1 {

                font-size: 25px;

            }


            .contacts {

                padding: 45px 20px;

            }


            .contact-box {

                padding: 25px;

            }

        }

    </style>

</head>


<body>

    <header>

        <h1>
            СУ „Недялка Шилева“
        </h1>


        <a href="index.html">

        </a>

        </div>


        <div class="contact-box">


            <div class="contact-item">

                <h3>
                    📍 Адрес
                </h3>

                <p>
                    4190, гр. Съединение,<br>
                    обл. Пловдивска,<br>
                    ул. „Баба Исака Скачкова” № 3
                </p>

            </div>


            <div class="contact-item">

                <h3>
                    ☎ Телефон
                </h3>

                <p>
                    0879 600 898<br>
                    0318 / 22032
                </p>

            </div>


            <div class="contact-item">

                </p>

            </div>


        </div>


        <div class="back">

            <a href="index.html">
                ← Обратно към началото
            </a>

        </div>


    </main>


</body>

</html>
