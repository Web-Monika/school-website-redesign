    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #faf7f1;
            color: #252525;
        }

        header {
            background: #fffdf8;
            border-bottom: 1px solid #e8dfd2;

            padding: 25px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 32px;
        }

        header a {
            text-decoration: none;
            color: #8e2928;
            font-size: 14px;
        }

        header a:hover {
            color: #28553d;
        }

        .gallery {
            max-width: 1100px;
            margin: auto;
            padding: 60px 20px;
        }

        .gallery-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery-title h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 42px;
            margin-bottom: 8px;
        }

        .gallery-title p {
            font-size: 13px;
            color: #777;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .gallery-item {
            overflow: hidden;
            background: #fffdf8;
            border: 1px solid #e4dacd;
        }

        .gallery-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;

            transition: 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .back {
            text-align: center;
            margin-top: 40px;
        }

        .back a {
            display: inline-block;

            background: #8e2928;
            color: white;

            padding: 11px 22px;
            border-radius: 25px;

            text-decoration: none;
            font-size: 13px;

            transition: 0.3s;
        }

        .back a:hover {
            background: #6f2020;
        }

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 26px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-item img {
                height: 240px;
            }

        }

    </style>
</head>
